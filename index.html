<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F1B16">
<meta name="color-scheme" content="light">
<title>Control Urbano V6 · React</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<style>
  /* Hacer visible #pantalla-login aunque styles.css lo oculte por defecto */
  #pantalla-login { display: flex; }
  /* Root mounting point ocupa la pantalla */
  #root { min-height: 100vh; }
</style>
</head>
<body>

<div id="root"></div>

<!-- React + Babel pinneados -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- Turf.js para consulta espacial POT (mismo que producción V2) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

<!-- Google Maps JS API (mapa satellite + geocoder) -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDzMA8veDuEp3yBTBjjLS7y0k5XUu8rchc&libraries=geocoding" async defer></script>


<!-- Cliente webhook (JS plano) — bump ?v= cuando cambie el código para invalidar caché del SW -->
<script src="api.js?v=25"></script>
<script src="utils.js?v=25"></script>

<!-- Componentes React (cada uno expone su componente en window) -->
<script type="text/babel" src="modal.jsx?v=25"></script>
<script type="text/babel" src="informe-modal.jsx?v=25"></script>
<script type="text/babel" src="visita-detail-modal.jsx?v=25"></script>
<script type="text/babel" src="login.jsx?v=25"></script>
<script type="text/babel" src="home.jsx?v=25"></script>
<script type="text/babel" src="mis-visitas.jsx?v=25"></script>
<script type="text/babel" src="buscar.jsx?v=25"></script>
<script type="text/babel" src="agenda.jsx?v=25"></script>
<script type="text/babel" src="gestion.jsx?v=25"></script>
<script type="text/babel" src="nueva-visita.jsx?v=25"></script>
<script type="text/babel" src="consulta-norma.jsx?v=25"></script>
<script type="text/babel" src="admin.jsx?v=25"></script>

<!-- App principal (último: usa LoginScreen, HomeScreen, AdminScreen del window) -->
<script type="text/babel" src="app.jsx?v=25"></script>

<!-- Registro del Service Worker (cache de assets estáticos) -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js')
      .then(function(reg) {
        console.log('[SW] registrado, scope:', reg.scope);
        // Si hay un SW nuevo esperando, recargar automáticamente cuando tome control
        if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        reg.addEventListener('updatefound', function() {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function() {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('[SW] versión nueva instalada, recargando...');
              window.location.reload();
            }
          });
        });
      })
      .catch(function(e) { console.warn('[SW] fallo registro:', e); });

    // Si el SW cambia de controller (activate de nuevo SW), recargar
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}
</script>

</body>
</html>
