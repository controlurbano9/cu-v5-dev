<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F1B16">
<meta name="color-scheme" content="light">
<title>Control Urbano V6 · React</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<style>
  /* Hacer visible #pantalla-login aunque styles.css lo oculte por defecto */
  #pantalla-login { display: flex; }
  /* Root mounting point ocupa la pantalla */
  #root { min-height: 100vh; }
</style>
</head>
<body>

<div id="root"></div>

<!-- React (Babel-standalone eliminado: el bundle se pre-transpila con esbuild) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<!-- Turf.js para consulta espacial POT (mismo que producción V2) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

<!-- Google Maps JS API (mapa satellite + geocoder) -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDzMA8veDuEp3yBTBjjLS7y0k5XUu8rchc&libraries=geocoding" async defer></script>


<!-- Cliente webhook (JS plano) — bump ?v= cuando cambie el código para invalidar caché del SW -->
<!-- offline-queue debe cargar ANTES de api.js: api.js usa offlineEnqueue al fallar por red -->
<script src="offline-queue.js?v=67"></script>
<script src="api.js?v=67"></script>
<script src="utils.js?v=67"></script>

<!-- ─────────────────────────────────────────────────────────────
     PRODUCCIÓN: bundle.min.js pre-transpilado y minificado con esbuild.
     Sin @babel/standalone en runtime → ahorro ~770 KB de descarga
     y ~400 ms de transpilación en cada arranque.
     Regenerar tras editar JSX:  node build.js   (o npm run build)
     ───────────────────────────────────────────────────────────── -->
<script src="bundle.min.js?v=67"></script>


<!-- Registro del Service Worker (cache de assets estáticos) -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js')
      .then(function(reg) {
        console.log('[SW] registrado, scope:', reg.scope);
        // Si hay un SW nuevo esperando, pedirle skipWaiting → tomará control
        // y disparará 'controllerchange' (handler único debajo se encarga del reload).
        if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        reg.addEventListener('updatefound', function() {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function() {
            // Cuando el nuevo SW termina de instalar y ya hay un controller previo,
            // significa que hay una versión esperando: pedirle activarse.
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('[SW] versión nueva instalada, activando...');
              nw.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });
      })
      .catch(function(e) { console.warn('[SW] fallo registro:', e); });

    // Único punto de reload: cuando un SW nuevo toma control de la pestaña.
    // En la primera carga (sin controller previo) no se dispara — evita
    // el reload espurio del primer ingreso.
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (refreshing) return;
      refreshing = true;
      console.log('[SW] controller cambió, recargando...');
      window.location.reload();
    });
  });
}
</script>

</body>
</html>
